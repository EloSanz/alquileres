name: Deploy Alquileres

on:
  push:
    branches: [ develop ]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: hostinger

    steps:
    - name: Verify SSH credentials exist
      run: |
        if [ -z "${{ secrets.SSH_HOST }}" ]; then echo "❌ SSH_HOST no está configurado"; exit 1; fi
        if [ -z "${{ secrets.SSH_PASSWORD }}" ]; then echo "❌ SSH_PASSWORD no está configurado"; exit 1; fi
        echo "✔ Credenciales SSH verificadas"

    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: root
        password: ${{ secrets.SSH_PASSWORD }}
        port: 22
        timeout: 300s
        script: |
          set -e
          cd /root/alquileres

          echo "📥 [1/6] Git pull..."
          git pull origin develop

          echo "📦 [2/6] Instalando dependencias..."
          cd server && npm install --legacy-peer-deps
          cd ../web && npm install --legacy-peer-deps
          cd ..

          echo "🗄️ [3/6] Aplicando migraciones de DB..."
          cd server
          npx prisma migrate deploy
          npx prisma generate
          echo "🌱 Seed de patio tenants (idempotente)..."
          npx prisma db execute --file prisma/patio_seed.sql --schema prisma/schema.prisma
          cd ..

          echo "🔨 [4/6] Compilando backend..."
          cd server && npm run build:fast
          cd ..

          echo "🎨 [5/6] Compilando frontend..."
          cd web && npm run build
          cd ..

          echo "🚀 [6/6] Reiniciando servicios..."
          pm2 restart alquileres-backend
          pm2 save

          echo "✅ Deploy completado!"
